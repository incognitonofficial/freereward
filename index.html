<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LiveMetrics - ہوم</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons (لوگو اور صارفین کے آئیکن کے لیے) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- ہیڈر: لوگو + سائٹ کا نام -->
        <header class="main-header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
            </div>
            <h1 class="site-name">LiveMetrics</h1>
        </header>

        <!-- آن لائن صارفین کی تعداد + تاریخ -->
        <div class="stats-panel">
            <div class="online-users">
                <i class="fas fa-users"></i>
                <span id="userCount">200</span>
                <span> آن لائن صارفین</span>
            </div>
            <div class="last-update">
                <i class="fas fa-calendar-alt"></i>
                <span id="updateDate">----</span>
            </div>
        </div>

        <!-- صرف 5 کارڈز (بالکل خالی، آپ خود تصاویر اور متن ڈالیں گے) -->
        <div class="cards-row">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>
    </div>

    <script>
        // رینڈم صارفین کی تعداد 200 سے 800 کے درمیان
        function getRandomUserCount() {
            return Math.floor(Math.random() * (800 - 200 + 1)) + 200;
        }

        // آج کی تاریخ اردو سٹائل میں
        function getTodayDate() {
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return today.toLocaleDateString('ur-PK', options);
        }

        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('userCount').textContent = getRandomUserCount();
            document.getElementById('updateDate').textContent = getTodayDate();
        });
    </script>
</body>
</html>
