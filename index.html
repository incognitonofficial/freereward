<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="google-site-verification" content="Fbf8OX5GQKsrU1oNJZUuLf-Yy1GU1hePzuu1arDEknA" />
    <title>GiftCards</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- لوگو (container سے باہر) -->
    <div class="logo-wrapper">
        <img src="images/logo3.png" alt="Logo" class="logo-img">
    </div>

    <!-- Stats Panel (container سے باہر) -->
   <div class="stats-panel">
    <div class="stats-line">
        <i class="fas fa-users"></i>
        <span id="userCount">200</span>
        <span> Online Users</span>
        <span class="separator">|</span>
        <i class="fas fa-calendar-alt"></i>
        <span id="updateDate">----</span>
    </div>
</div>
    <!-- کارڈز (container سے باہر) -->
    <div class="cards-row">
        <div class="card clickable" data-card="fortnite">
            <img src="images/fortnitecard.png" alt="">
        </div>
        <div class="card clickable" data-card="google">
            <img src="images/googlegiftcard.png" alt="">
        </div>
        <div class="card clickable" data-card="minecraft">
            <img src="images/minecraftcard.png" alt="">
        </div>
        <div class="card clickable" data-card="playstation">
            <img src="images/playstationgiftcard.png" alt="">
        </div>
        <div class="card clickable" data-card="roblox">
            <img src="images/robloxcard.png" alt="">
        </div>
        <div class="card clickable" data-card="bestway">
            <img src="images/bestway.png" alt="">
        </div>
        <div class="card clickable" data-card="xbox">
            <img src="images/xboxgiftcard.png" alt="">
        </div>
        <div class="card clickable" data-card="amazon">
            <img src="images/amazon.png" alt="">
        </div>

<div class="card clickable" data-card="apple">
            <img src="images/apple.png" alt="">
        </div>
<div class="card clickable" data-card="itunes">
            <img src="images/itunes.png" alt="">
        </div> 
        <div class="card clickable" data-card="switch">
            <img src="images/switch.png" alt="">
        </div>
        <div class="card clickable" data-card="steam">
            <img src="images/steam.png" alt="">
        </div>
    <div class="card clickable" data-card="spotify">
            <img src="images/spotify.png" alt="">
        </div>
<div class="card clickable" data-card="discord">
            <img src="discord/discord.png" alt="">
        </div>

        <div class="card clickable" data-card="playstationplus">
            <img src="images/playstationplus.png" alt="">
        </div>
<div class="card clickable" data-card="walmart">
            <img src="images/walmart.png" alt="">
        </div>

        <div class="card clickable" data-card="shein">
            <img src="images/shein.png" alt="">
        </div>
        
<div class="card clickable" data-card="twitch">
            <img src="images/twitch.png" alt="">
        </div>  
    </div>

    <!-- Disclaimer (container سے باہر) -->
    <div class="disclaimer">
        <p><strong>How this works:</strong> This website is supported by sponsors. When you click "Complete Now", you will see offers from our partners. Completing an offer unlocks your gift card. This helps us keep the site completely free for everyone.</p>
    </div>

    <script>
        let currentUsers = 200;

        function updateUserCountSlowly() {
            let change = Math.floor(Math.random() * 35) + 5;
            if (Math.random() > 0.5) {
                currentUsers += change;
            } else {
                currentUsers -= change;
            }
            if (currentUsers > 800) currentUsers = 800;
            if (currentUsers < 200) currentUsers = 200;
            document.getElementById('userCount').textContent = currentUsers;
        }

        function setTodayDate() {
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('updateDate').textContent = today.toLocaleDateString('en-US', options);
        }

        function setupCardClick() {
            const cards = document.querySelectorAll('.card.clickable');
            cards.forEach(card => {
                card.addEventListener('click', function() {
                    const cardType = this.getAttribute('data-card');
                    window.location.href = `page2.html?card=${cardType}`;
                });
            });
        }

        window.addEventListener('DOMContentLoaded', function() {
            setTodayDate();
            currentUsers = Math.floor(Math.random() * (800 - 200 + 1)) + 200;
            document.getElementById('userCount').textContent = currentUsers;
            setInterval(updateUserCountSlowly, 3000);
            setupCardClick();
        });
    </script>
</body>
</html>
