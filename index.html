<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeReward Hub</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-900 text-white">

<div class="max-w-6xl mx-auto px-6 py-10 text-center">

  <!-- TITLE -->
  <h1 class="text-5xl font-bold mb-2">🎉 FreeReward Hub</h1>

  <!-- LIVE INFO -->
  <div class="text-gray-200 mb-10 text-sm md:text-base">
    User Online: <span id="users"></span> | Last update: <span id="date"></span>
  </div>

  <!-- CARDS GRID -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-6 max-w-6xl mx-auto place-items-center">

    <a href="page2.html?card=1" class="card relative z-0 transition-all duration-300 hover:scale-105 hover:z-20 w-full md:w-[300px] h-[360px] overflow-hidden rounded-2xl border border-white/10">
      <img src="robloxcard.png" class="w-full h-full object-cover">
    </a>

    <a href="page2.html?card=2" class="card relative z-0 transition-all duration-300 hover:scale-105 hover:z-20 w-full md:w-[300px] h-[360px] overflow-hidden rounded-2xl border border-white/10">
      <img src="xboxgiftcard.png" class="w-full h-full object-cover">
    </a>

    <a href="page2.html?card=3" class="card relative z-0 transition-all duration-300 hover:scale-105 hover:z-20 w-full md:w-[300px] h-[360px] overflow-hidden rounded-2xl border border-white/10">
      <img src="fortnitecard.png" class="w-full h-full object-cover">
    </a>

    <a href="page2.html?card=4" class="card relative z-0 transition-all duration-300 hover:scale-105 hover:z-20 w-full md:w-[300px] h-[360px] overflow-hidden rounded-2xl border border-white/10">
      <img src="minecrafrcard.png" class="w-full h-full object-cover">
    </a>

    <a href="page2.html?card=5" class="card relative z-0 transition-all duration-300 hover:scale-105 hover:z-20 w-full md:w-[300px] h-[360px] overflow-hidden rounded-2xl border border-white/10">
      <img src="playstationgiftcard.png" class="w-full h-full object-cover">
    </a>

    <a href="page2.html?card=6" class="card relative z-0 transition-all duration-300 hover:scale-105 hover:z-20 w-full md:w-[300px] h-[360px] overflow-hidden rounded-2xl border border-white/10">
      <img src="googlegiftcard.png" class="w-full h-full object-cover">
    </a>

  </div>

</div>

<!-- SCRIPT -->
<script>
document.getElementById("date").innerText = new Date().toDateString();

let base = 200;

function updateUsers(){
  document.getElementById("users").innerText =
    base + Math.floor(Math.random() * 20);
}

updateUsers();
setInterval(updateUsers, 4000);
</script>

</body>
</html>
