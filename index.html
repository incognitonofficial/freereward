<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeReward Hub</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black text-white min-h-screen overflow-x-hidden">

 <div class="w-full flex flex-col items-center pt-4">
<div class="flex justify-center mt-6">
  <img src="images/logo.png" class="w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 shadow-lg">
</div>
  
  <!-- LIVE INFO -->
  <div class="text-gray-200 mb-10 text-sm md:text-base">
    User Online: <span id="users"></span> | Last update: <span id="date"></span>
  </div>

  <!-- CARDS GRID FIXED -->
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6 max-w-6xl mx-auto px-4 py-6">

    <!-- CARD 1 -->
    <a href="page2.html?card=1"
      class="card w-full max-w-[220px] h-[320px] overflow-hidden rounded-2xl border border-white/10 transition-all duration-300 hover:scale-105 hover:z-20">
      <img src="images/robloxcard.png" class="w-full h-full object-contain bg-black/20">
    </a>

    <!-- CARD 2 -->
    <a href="page2.html?card=2"
      class="card w-full max-w-[220px] h-[320px] overflow-hidden rounded-2xl border border-white/10 transition-all duration-300 hover:scale-105 hover:z-20">
      <img src="images/xboxgiftcard.png" class="w-full h-full object-contain bg-black/20">
    </a>

    <!-- CARD 3 -->
    <a href="page2.html?card=3"
      class="card w-full max-w-[220px] h-[320px] overflow-hidden rounded-2xl border border-white/10 transition-all duration-300 hover:scale-105 hover:z-20">
      <img src="images/fortnitecard.png" class="w-full h-full object-contain bg-black/20">
    </a>

    <!-- CARD 4 -->
    <a href="page2.html?card=4"
      class="card w-full max-w-[220px] h-[320px] overflow-hidden rounded-2xl border border-white/10 transition-all duration-300 hover:scale-105 hover:z-20">
      <img src="images/minecraftcard.png" class="w-full h-full object-contain bg-black/20">
    </a>

    <!-- CARD 5 -->
    <a href="page2.html?card=5"
      class="card w-full max-w-[220px] h-[320px] overflow-hidden rounded-2xl border border-white/10 transition-all duration-300 hover:scale-105 hover:z-20">
      <img src="images/playstationgiftcard.png" class="w-full h-full object-contain bg-black/20">
    </a>

    <!-- CARD 6 -->
    <a href="page2.html?card=6"
      class="card w-full max-w-[220px] h-[320px] overflow-hidden rounded-2xl border border-white/10 transition-all duration-300 hover:scale-105 hover:z-20">
      <img src="images/googlegiftcard.png" class="w-full h-full object-contain bg-black/20">
    </a>

  </div>

</div>

<!-- SCRIPT -->
<script>
document.getElementById("date").innerText = new Date().toDateString();

let base = 200;

function updateUsers(){
  document.getElementById("users").innerText =
    base + Math.floor(Math.random() * 20);
}

updateUsers();
setInterval(updateUsers, 4000);
</script>

</body>
</html>
