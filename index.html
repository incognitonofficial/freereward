<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeReward Hub</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  background: linear-gradient(135deg,#0b1020,#111827,#0ea5e9);
  font-family: sans-serif;
}

.card{
  transition:0.3s;
}

.card:hover{
  transform: translateY(-8px);
}
  .card{
  transition: all 0.3s ease;
}

.card:hover{
  transform: scale(1.05);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
  @keyframes gradientMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

body{
  background: linear-gradient(-45deg, #0b1020, #0ea5e9, #e0f2fe, #111827);
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
}
</style>
</head>

<body class="text-white">

<div class="max-w-6xl mx-auto px-6 py-10 text-center">

  <!-- TITLE -->
  <h1 class="text-5xl font-bold mb-2">🎉 FreeReward Hub</h1>

  <!-- LIVE INFO -->
  <div class="text-gray-200 mb-10 text-sm md:text-base">
    User Online: <span id="users"></span> | Last update: <span id="date"></span>
  </div>

  <!-- CARDS -->
  <div class="flex flex-col md:flex-row gap-6 justify-center">

    <a href="page2.html?card=1"
    class="card w-full md:w-[280px] h-[360px] bg-cyan-500/20 p-6 rounded-2xl border border-white/10">

      <div class="text-4xl mb-2">🎁</div>
      <h2 class="text-2xl font-bold">Daily Rewards</h2>
      <p class="text-gray-300 mt-3 text-sm">Claim free rewards daily</p>

    </a>

    <a href="page2.html?card=2"
    class="card w-full md:w-[280px] h-[360px] bg-purple-500/20 p-6 rounded-2xl border border-white/10">

      <div class="text-4xl mb-2">⚡</div>
      <h2 class="text-2xl font-bold">Fast Offers</h2>
      <p class="text-gray-300 mt-3 text-sm">Quick earning tasks</p>

    </a>

    <a href="page2.html?card=3"
    class="card w-full md:w-[280px] h-[360px] bg-yellow-500/20 p-6 rounded-2xl border border-white/10">

      <div class="text-4xl mb-2">🏆</div>
      <h2 class="text-2xl font-bold">Winner System</h2>
      <p class="text-gray-300 mt-3 text-sm">Top rewards system</p>

    </a>

  </div>

</div>

<!-- SCRIPT -->
<script>

// DATE (auto update)
document.getElementById("date").innerText =
new Date().toDateString();

// FAKE LIVE USER COUNTER (realistic feel)
let base = 200;

function updateUsers(){
  let random = Math.floor(Math.random() * 20); // 200–220 range
  document.getElementById("users").innerText = base + random;
}

updateUsers();
setInterval(updateUsers, 4000);

</script>

</body>
</html>
