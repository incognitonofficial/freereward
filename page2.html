<script>

document.addEventListener("DOMContentLoaded", function () {

  document.getElementById("date").innerText = new Date().toDateString();

  // USERS
  let base = 200 + Math.floor(Math.random() * 20);

  function updateUsers(){
    const el = document.getElementById("users");
    let random = Math.floor(Math.random() * 20);
    el.innerText = base + random;
  }

  updateUsers();
  setInterval(updateUsers, 4000);

  // 🟢 FIX 1: URL CARD SYSTEM
  const params = new URLSearchParams(window.location.search);
  const card = params.get("card") || "1";

  // 🟢 FIX 2: DATA MAP
  const data = {
    "1": "robloxcard.png",
    "2": "xboxgiftcard.png",
    "3": "fortnitecard.png",
    "4": "minecrafrcard.png"
  };

  // IMAGE LOAD
  const box = document.getElementById("selected");

  box.innerHTML = `
    <img src="${data[card]}"
    class="w-full h-full object-cover">
  `;

  // MODAL ELEMENTS
  const overlay = document.getElementById("overlay");
  const randomBox = document.getElementById("randomBox");
  const resultBox = document.getElementById("resultBox");
  const ctaBox = document.getElementById("ctaBox");
  const popupImg = document.getElementById("popupImg");

  // CLICK
  box.addEventListener("click", function () {

    overlay.classList.remove("hidden");

    // 🟢 FIX 3: POPUP IMAGE MATCH CARD
    popupImg.src = data[card];

    resultBox.classList.add("hidden");
    ctaBox.classList.add("hidden");
    randomBox.innerText = "0";

    function get4Digit() {
      return Math.floor(1000 + Math.random() * 9000);
    }

    let step = 0;
    let maxSteps = 25;

    let interval = setInterval(() => {

      randomBox.innerText =
        get4Digit() + " " +
        get4Digit() + " " +
        get4Digit() + " " +
        get4Digit();

      step++;

      if (step >= maxSteps) {
        clearInterval(interval);

        resultBox.classList.remove("hidden");
        ctaBox.classList.remove("hidden");
      }

    }, 200);

  });

  // CLOSE
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) {
      overlay.classList.add("hidden");
      resultBox.classList.add("hidden");
      ctaBox.classList.add("hidden");
      randomBox.innerText = "0";
    }
  });

});

</script>
