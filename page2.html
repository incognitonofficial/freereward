<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeReward Offer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-900 text-white">

<div class="container">

  <!-- HEADER -->
  <h1 class="title">🎉 FreeReward Hub</h1>

  <div class="info">
    User Online: <span id="users"></span> | Last update: <span id="date"></span>
  </div>

  <!-- SELECTED CARD -->
  <div id="selected" class="selected-box"></div>

  <!-- BUTTON -->
  <a href="YOUR_CPA_LINK" class="btn">
    Continue Offer 🚀
  </a>

</div>

<script>

// DATE
document.getElementById("date").innerText =
new Date().toDateString();

// LIVE USERS
let base = 200;

function updateUsers(){
  let random = Math.floor(Math.random() * 30);
  document.getElementById("users").innerText = base + random;
}

updateUsers();
setInterval(updateUsers, 2000);

// CARD SYSTEM
const params = new URLSearchParams(window.location.search);
let card = params.get("card");

const data = {
  1: "roblox.jpeg",
  2: "roblox.jpeg",
  3: "roblox.jpeg",
  4: "roblox.jpeg"
};

let box = document.getElementById("selected");

if (data[card]) {
  box.innerHTML = <img src="${data[card]}" class="card-img">;
} else {
  box.innerHTML = <p class="error">Invalid Card Selected</p>;
}

</script>

</body>
</html>
