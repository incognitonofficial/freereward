<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page 2</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white text-center">

<h1 class="text-5xl mt-6">🎉 FreeReward Hub</h1>

<div class="mt-4 text-gray-300">
User Online: <span id="users">0</span> |
Last update: <span id="date">-</span>
</div>

<div id="selected" class="mt-6"></div>

<script>

try {

  // DATE SAFE
  const dateEl = document.getElementById("date");
  if (dateEl) dateEl.innerText = new Date().toDateString();

  // FAKE LIVE USER COUNTER (realistic feel)
let base = 200 + Math.floor(Math.random() * 20);

function updateUsers(){
  let random = Math.floor(Math.random() * 20);
  document.getElementById("users").innerText = base + random;
}

updateUsers();
setInterval(updateUsers, 4000);
});

  // CARD SAFE
  const params = new URLSearchParams(window.location.search);
  const card = params.get("card");

  const data = {
    "1": "roblox.jpeg",
    "2": "roblox.jpeg",
    "3": "roblox.jpeg",
    "4": "roblox.jpeg"
  };

  const box = document.getElementById("selected");

  if (box) {
    if (data[card]) {
      box.innerHTML = `
        <img src="${data[card]}"
        style="width:320px;height:350px;object-fit:cover;border-radius:16px;">
      `;
    } else {
      box.innerHTML = "<p>No Card Selected</p>";
    }
  }

} catch (err) {
  console.log("PAGE2 ERROR:", err);
}

</script>

</body>
</html>
