<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Page</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black text-white min-h-screen text-center">

<!-- TITLE -->
<h1 class="text-4xl md:text-5xl font-bold pt-8">
  🎉 FreeReward Hub
</h1>

<!-- INFO -->
<div class="mt-2 text-gray-300">
  User Online: <span id="users">200</span> |
  Last update: <span id="date"></span>
</div>

<!-- GRID (3 cards show here) -->
<div id="grid"
class="grid grid-cols-2 justify-center gap-4 max-w-fit mx-auto mt-8">
</div>

<!-- POPUP -->
<div id="overlay"
class="hidden fixed inset-0 bg-black/95 z-[9999] flex flex-col items-center justify-center px-4">

  <img id="popupImg"
  class="w-full max-w-[220px] h-[320px] object-cover rounded-2xl shadow-2xl">

  <div class="bg-white text-black mt-4 w-[240px] p-3 rounded-xl font-bold text-2xl">
    <div id="randomBox">0</div>
  </div>

  <div id="resultBox"
  class="hidden text-white mt-4 text-2xl font-bold">
    Your code is ready ✅
  </div>

  <a id="ctaBox"
  href="https://www.google.com/"
  target="_blank"
  class="hidden mt-4 bg-green-500 hover:bg-green-600 px-6 py-3 rounded-xl font-bold transition">
    Continue Offer 🚀
  </a>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

  // DATE
  document.getElementById("date").innerText =
    new Date().toDateString();

  // USERS
  let base = 200;

  function updateUsers(){
    document.getElementById("users").innerText =
      base + Math.floor(Math.random() * 20);
  }

  updateUsers();
  setInterval(updateUsers, 4000);

  // URL PARAM
  const params = new URLSearchParams(window.location.search);
  const card = params.get("card") || "1";

  // GRID DATA (3 options per card)
  const dataGrid = {
    "1": ["images/roblox25.png","images/roblox50.png","images/roblox100.png"],
    "2": ["images/xboxgiftcard25.png","images/xboxgiftcard50.png","images/xboxgiftcard100.png"],
    "3": ["images/fortnitecard25.png","images/fortnitecard50.png","images/fortnitecard100.png"],
    "4": ["images/minecraft25.png","images/minecraft50.png","images/minecraft100.png"],
    "5": ["images/playstationgiftcard25.png","images/playstationgiftcard25.png","images/playstationgiftcard100.png"],
    "6": ["images/googlegiftcard25.png","images/googlegiftcard50.png","images/googlegiftcard100.png"]
  };

  const grid = document.getElementById("grid");

  // render grid
  if(dataGrid[card]){

    dataGrid[card].forEach(img => {

      grid.innerHTML += `
        <div onclick="selectCard('${img}')"
        class="cursor-pointer w-full max-w-[200px] h-[280px] overflow-hidden rounded-2xl border border-white/10 transition-all duration-300 hover:scale-105 hover:shadow-2xl">

          <img src="${img}" class="w-full h-full object-cover">

        </div>
      `;

    });

  }

  // POPUP SYSTEM
  const overlay = document.getElementById("overlay");
  const popupImg = document.getElementById("popupImg");
  const randomBox = document.getElementById("randomBox");
  const resultBox = document.getElementById("resultBox");
  const ctaBox = document.getElementById("ctaBox");

  window.selectCard = function(img){

    overlay.classList.remove("hidden");

    popupImg.src = img;

    resultBox.classList.add("hidden");
    ctaBox.classList.add("hidden");

    randomBox.innerText = "0";

    let step = 0;

    function get4Digit(){
      return Math.floor(1000 + Math.random() * 9000);
    }

    let interval = setInterval(() => {

      randomBox.innerText =
        get4Digit() + " " +
        get4Digit() + " " +
        get4Digit() + " " +
        get4Digit();

      step++;

      if(step >= 25){
        clearInterval(interval);
        resultBox.classList.remove("hidden");
        ctaBox.classList.remove("hidden");
      }

    }, 120);

  };

  overlay.addEventListener("click", function(e){
    if(e.target === overlay){

      overlay.classList.add("hidden");
      resultBox.classList.add("hidden");
      ctaBox.classList.add("hidden");
      randomBox.innerText = "0";

    }
  });

});

</script>

</body>
</html>
