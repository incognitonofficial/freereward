<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Page</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white text-center">

<!-- TITLE -->
<h1 class="text-4xl font-bold mt-6">🎉 FreeReward Hub</h1>

<!-- INFO -->
<div class="mt-2 text-gray-300">
User Online: <span id="users">200</span> |
Last update: <span id="date"></span>
</div>

<!-- MAIN CARD (same style as index) -->
<div id="selected"
class="card w-full max-w-[220px] h-[320px] mx-auto mt-8 overflow-hidden rounded-2xl border border-white/10 transition-all duration-300 hover:scale-105 hover:z-20">
</div>

<div id="grid" class="grid grid-cols-3 gap-4 mt-10 max-w-4xl mx-auto"></div>
  
<!-- MODAL -->
<div id="overlay"
class="hidden fixed inset-0 bg-black/95 z-[9999] flex flex-col items-center justify-center">

  <img id="popupImg"
  class="w-full max-w-[220px] h-[320px] object-contain bg-black/20 rounded-2xl">

  <div class="bg-white text-black mt-4 w-[220px] p-3 rounded-xl font-bold text-2xl">
    <div id="randomBox">0</div>
  </div>

  <div id="resultBox" class="hidden text-white mt-3 text-xl font-bold">
    Your code is ready ✅
  </div>

  <a id="ctaBox" href="https://www.google.com/"
  target="_blank"
  class="hidden mt-4 bg-green-500 px-6 py-3 rounded-xl font-bold">
    Continue Offer 🚀
  </a>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

  // DATE
  document.getElementById("date").innerText = new Date().toDateString();

  // USERS
  let base = 200;

  function updateUsers(){
    document.getElementById("users").innerText =
      base + Math.floor(Math.random() * 20);
  }

  updateUsers();
  setInterval(updateUsers, 4000);

  // CARD SYSTEM
  const params = new URLSearchParams(window.location.search);
  const card = params.get("card") || "1";

  const data = {
    "1": "robloxcard.png",
    "2": "xboxgiftcard.png",
    "3": "fortnitecard.png",
    "4": "minecraftcard.png",
    "5": "playstationgiftcard.png",
    "6": "googlegiftcard.png"
  };

  const box = document.getElementById("selected");

  box.innerHTML = `
    <img src="${data[card] || 'robloxcard.png'}"
    class="w-full h-full object-contain bg-black/20">
  `;

  const overlay = document.getElementById("overlay");
  const popupImg = document.getElementById("popupImg");
  const randomBox = document.getElementById("randomBox");
  const resultBox = document.getElementById("resultBox");
  const ctaBox = document.getElementById("ctaBox");

  box.addEventListener("click", function () {

    overlay.classList.remove("hidden");
    popupImg.src = data[card] || "robloxcard.png";

    resultBox.classList.add("hidden");
    ctaBox.classList.add("hidden");
    randomBox.innerText = "0";

    function get4Digit(){
      return Math.floor(1000 + Math.random() * 9000);
    }

    let step = 0;
    let maxSteps = 25;

    let interval = setInterval(() => {

      randomBox.innerText =
        get4Digit() + " " +
        get4Digit() + " " +
        get4Digit() + " " +
        get4Digit();

      step++;

      if(step >= maxSteps){
        clearInterval(interval);
        resultBox.classList.remove("hidden");
        ctaBox.classList.remove("hidden");
      }

    }, 200);

  });

  overlay.addEventListener("click", function (e) {
    if(e.target === overlay){
      overlay.classList.add("hidden");
      resultBox.classList.add("hidden");
      ctaBox.classList.add("hidden");
      randomBox.innerText = "0";
    }
  });

});

const params = new URLSearchParams(window.location.search);
const main = params.get("main") || "roblox";

const data = {
  roblox: ["roblox1.png","roblox2.png","roblox3.png"],
  xbox: ["xbox1.png","xbox2.png","xbox3.png"],
  fortnite: ["fortnite1.png","fortnite2.png","fortnite3.png"]
};

const grid = document.getElementById("grid");

data[main].forEach(img => {
  grid.innerHTML += `
    <div onclick="selectCard('${img}')"
    class="cursor-pointer w-[180px] h-[240px] overflow-hidden rounded-xl border border-white/10 hover:scale-105 transition">
      <img src="${img}" class="w-full h-full object-cover">
    </div>
  `;
});

function selectCard(img){
  alert("Selected: " + img);
}
  
</script>

</body>
</html>
