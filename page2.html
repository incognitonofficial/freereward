<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeReward Offer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>

<body class="text-white">

<div class="max-w-6xl mx-auto px-6 py-10 text-center">

  <!-- TITLE -->
  <h1 class="text-5xl font-bold mb-2">🎉 FreeReward Hub</h1>

  <!-- LIVE INFO -->
  <div class="text-gray-200 mb-10 text-sm md:text-base">
    User Online: <span id="users"></span> |
    Last update: <span id="date"></span>
  </div>

  <!-- SELECTED CARD -->
  <div id="selected"
  class="card w-full md:w-[280px] h-[360px] overflow-hidden rounded-2xl border border-white/10 mx-auto">
  </div>

</div>

<script>

// DATE
document.getElementById("date").innerText =
new Date().toDateString();

// LIVE USER COUNTER
let base = 200 + Math.floor(Math.random() * 20);

function updateUsers(){
  let random = Math.floor(Math.random() * 20);
  document.getElementById("users").innerText = base + random;
}

updateUsers();
setInterval(updateUsers, 4000);

// CARD SYSTEM
const params = new URLSearchParams(window.location.search);
const card = params.get("card");

const data = {
  "1": "roblox.jpeg",
  "2": "roblox.jpeg",
  "3": "roblox.jpeg",
  "4": "roblox.jpeg"
};

const box = document.getElementById("selected");

if(data[card]){
  box.innerHTML = `
    <img src="${data[card]}"
    class="w-full h-full object-cover">
  `;
}
else{
  box.innerHTML = `
    <div class="flex items-center justify-center h-full text-red-400">
      No Card Selected
    </div>
  `;
}

</script>

</body>
</html>
