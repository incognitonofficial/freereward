<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeReward Offer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>

<body class="text-white">

<div class="max-w-6xl mx-auto px-6 py-10 text-center">

  <h1 class="text-5xl font-bold mb-2">🎉 FreeReward Hub</h1>

  <div class="text-gray-200 mb-10 text-sm md:text-base">
    User Online: <span id="users">200</span> |
    Last update: <span id="date"></span>
  </div>

  <!-- CARD -->
  <div id="selected"
  class="w-[280px] h-[360px] mx-auto overflow-hidden rounded-2xl border border-white/10 cursor-pointer">
  </div>

</div>

<!-- MODAL -->
<div id="overlay"
class="hidden fixed inset-0 bg-black/70 flex items-center justify-center flex-col">

  <img id="popupImg"
  class="w-[280px] h-[360px] object-cover rounded-2xl">

  <div class="bg-white text-black mt-4 w-[280px] p-4 rounded-xl text-center font-bold">
    <div id="randomBox">0</div>
  </div>

  <div id="resultBox" class="hidden text-white mt-3 text-xl font-bold">
    Your code is ready ✅
  </div>

  <a id="ctaBox" href="YOUR_AFFILIATE_LINK"
  class="hidden mt-4 bg-green-500 px-6 py-3 rounded-xl font-bold">
    Continue Offer 🚀
  </a>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

  // DATE
  document.getElementById("date").innerText = new Date().toDateString();

  // USERS SAFE
  let base = 200;

  setInterval(() => {
    document.getElementById("users").innerText =
      base + Math.floor(Math.random() * 30);
  }, 1500);

  // CARD SYSTEM
  const params = new URLSearchParams(window.location.search);
  const card = params.get("card");

  const data = {
    "1": "roblox.jpeg",
    "2": "roblox.jpeg",
    "3": "roblox.jpeg",
    "4": "roblox.jpeg"
  };

  const box = document.getElementById("selected");
  const overlay = document.getElementById("overlay");
  const randomBox = document.getElementById("randomBox");
  const resultBox = document.getElementById("resultBox");
  const ctaBox = document.getElementById("ctaBox");

  if(data[card]){
    box.innerHTML = <img src="${data[card]}" class="w-full h-full object-cover">;
  }

  // CLICK
  box.addEventListener("click", function () {

    overlay.classList.remove("hidden");

    let count = 0;
    let target = Math.floor(Math.random() * 400) + 150;

    let interval = setInterval(() => {
      count += Math.floor(Math.random() * 20);

      randomBox.innerText = count;

      if(count >= target){
        clearInterval(interval);
        resultBox.classList.remove("hidden");
        ctaBox.classList.remove("hidden");
      }

    }, 60);

  });

  // CLOSE
  overlay.addEventListener("click", function (e) {
    if(e.target === overlay){
      overlay.classList.add("hidden");
      resultBox.classList.add("hidden");
      ctaBox.classList.add("hidden");
      randomBox.innerText = "0";
    }
  });

});

</script>

</body>
</html>
