<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GiftCards - انتخاب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="main-header">
            <div class="logo">
                <img src="logo.png" alt="Logo" class="logo-img">
            </div>
            <h1 class="site-name">GiftArena</h1>
        </div>

        <div class="stats-panel">
            <div class="online-users">
                <i class="fas fa-users"></i>
                <span id="userCount">200</span>
                <span> آن لائن صارفین</span>
            </div>
            <div class="last-update">
                <i class="fas fa-calendar-alt"></i>
                <span id="updateDate">----</span>
            </div>
        </div>

        <h2 class="selection-title">اپنی قیمت منتخب کریں</h2>
        
        <div class="cards-row" id="optionsRow">
            <!-- یہاں 3 آپشنز JavaScript سے ڈالیں گے -->
        </div>
    </div>

    <!-- پاپ اپ ماڈل -->
    <div id="popupModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="popup-image-area">
                <img id="popupImage" src="" alt="Selected Gift Card">
            </div>
            <div class="white-box">
                <div class="ip-counter">
                    <span class="ip-label">آپ کا IP ایڈریس:</span>
                    <span id="fakeIp">192.168.</span>
                    <span id="runningNumber">0</span>
                </div>
                <a id="affiliateButton" class="affiliate-btn" href="#" target="_blank">✨ کلک کریں ✨</a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // تصاویر کی لوکیشن (آپ کے مطابق)
        // ==========================================
        const cardImages = {
            fortnite: {
                main: "fortnitecard.png",
                25: "fortnitecard25.png",
                50: "fortnitecard50.png",
                100: "fortnitecard100.png"
            },
            google: {
                main: "googlegiftcard.png",
                25: "googlegiftcard25.png",
                50: "googlegiftcard50.png",
                100: "googlegiftcard100.png"
            },
            minecraft: {
                main: "minecraftcard.png",
                25: "minecraft25.png",
                50: "minecraft50.png",
                100: "minecraft100.png"
            },
            playstation: {
                main: "playstationgiftcard.png",
                25: "playstationgiftcard25.png",
                50: "playstationgiftcard50.png",
                100: "playstationgiftcard100.png"
            },
            roblox: {
                main: "robloxcard.png",
                25: "roblox25.png",
                50: "roblox50.png",
                100: "roblox100.png"
            }
        };

        // بٹن کا لنک (آپ اپنا affiliate لنک لگائیں)
        const affiliateLink = "https://wa.me/9234567890"; // <- اپنا لنک یہاں لگائیں

        let currentUsers = 200;
        let selectedCardType = null;
        let selectedValue = null;
        let runningInterval = null;
        let currentNumber = 0;
        let targetNumber = 0;

        function updateUserCountSlowly() {
            let change = Math.floor(Math.random() * 35) + 5;
            if (Math.random() > 0.5) {
                currentUsers += change;
            } else {
                currentUsers -= change;
            }
            if (currentUsers > 800) currentUsers = 800;
            if (currentUsers < 200) currentUsers = 200;
            document.getElementById('userCount').textContent = currentUsers;
        }

        function setTodayDate() {
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('updateDate').textContent = today.toLocaleDateString('ur-PK', options);
        }

        // URL سے کارڈ کی قسم حاصل کریں
        function getCardFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('card') || 'fortnite';
        }

        // 3 آپشن کارڈز بنائیں
        function loadOptions(cardType) {
            const optionsRow = document.getElementById('optionsRow');
            optionsRow.innerHTML = '';
            
            const values = [25, 50, 100];
            values.forEach(value => {
                const card = document.createElement('div');
                card.className = 'card option-card';
                card.setAttribute('data-value', value);
                
                const img = document.createElement('img');
                img.src = cardImages[cardType][value];
                img.alt = `${value} Gift Card`;
                
                const priceTag = document.createElement('span');
                priceTag.className = 'price-tag';
                priceTag.textContent = `$${value}`;
                
                card.appendChild(img);
                card.appendChild(priceTag);
                
                card.addEventListener('click', function() {
                    selectedValue = value;
                    showPopup(cardType, value);
                });
                
                optionsRow.appendChild(card);
            });
        }

        // پاپ اپ دکھائیں اور نمبر رن کریں
        function showPopup(cardType, value) {
            const modal = document.getElementById('popupModal');
            const popupImage = document.getElementById('popupImage');
            const affiliateBtn = document.getElementById('affiliateButton');
            
            // تصویر سیٹ کریں
            popupImage.src = cardImages[cardType][value];
            
            // لنک سیٹ کریں
            affiliateBtn.href = affiliateLink;
            
            // رینڈم IP جیسی تعداد بنائیں (10000 سے 99999 کے درمیان)
            targetNumber = Math.floor(Math.random() * (99999 - 10000 + 1)) + 10000;
            currentNumber = 0;
            
            const runningSpan = document.getElementById('runningNumber');
            const fakeIpSpan = document.getElementById('fakeIp');
            
            // رینڈم IP بنائیں
            const ipParts = [Math.floor(Math.random() * 255), Math.floor(Math.random() * 255), Math.floor(Math.random() * 255)];
            fakeIpSpan.textContent = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.`;
            
            runningSpan.textContent = currentNumber;
            
            if (runningInterval) clearInterval(runningInterval);
            
            runningInterval = setInterval(() => {
                if (currentNumber < targetNumber) {
                    currentNumber += Math.floor(Math.random() * 500) + 100;
                    if (currentNumber > targetNumber) currentNumber = targetNumber;
                    runningSpan.textContent = currentNumber;
                } else {
                    clearInterval(runningInterval);
                    runningInterval = null;
                }
            }, 30);
            
            modal.style.display = "flex";
        }

        window.addEventListener('DOMContentLoaded', function() {
            setTodayDate();
            currentUsers = Math.floor(Math.random() * (800 - 200 + 1)) + 200;
            document.getElementById('userCount').textContent = currentUsers;
            setInterval(updateUserCountSlowly, 3000);
            
            selectedCardType = getCardFromURL();
            loadOptions(selectedCardType);
        });
        
        // پاپ اپ بند کرنے کا فنکشن
        document.querySelector('.close').onclick = function() {
            document.getElementById('popupModal').style.display = "none";
            if (runningInterval) clearInterval(runningInterval);
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('popupModal');
            if (event.target === modal) {
                modal.style.display = "none";
                if (runningInterval) clearInterval(runningInterval);
            }
        }
    </script>
</body>
</html>
