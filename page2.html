<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeReward Offer</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<div class="max-w-4xl mx-auto px-6 py-10 text-center">

  <!-- TITLE -->
  <h1 class="text-5xl font-bold mb-3">🎉 FreeReward Hub</h1>

  <!-- LIVE INFO -->
  <div class="text-gray-300 mb-6 text-sm md:text-base">
    User Online: <span id="users">0</span> |
    Last update: <span id="date"></span>
  </div>

  <!-- SELECTED CARD -->
  <div id="selected"
       class="mx-auto w-full md:w-[350px] rounded-2xl overflow-hidden border border-white/20 mb-6">
  </div>

  <!-- CTA (OPTIONAL CLEAN BUTTON) -->
  <a href="YOUR_CPA_LINK"
     class="block bg-green-500 hover:bg-green-600 p-4 rounded-xl font-bold">
     Continue Offer 🚀
  </a>

</div>

<script>

document.addEventListener("DOMContentLoaded", function() {

  // 📅 LAST UPDATE (today date)
  document.getElementById("date").innerText =
    new Date().toDateString();

  // 👥 LIVE USER COUNTER
  let base = 200;

  function updateUsers(){
    let random = Math.floor(Math.random() * 40); // 200–240
    document.getElementById("users").innerText = base + random;
  }

  updateUsers();
  setInterval(updateUsers, 1500);

  // 🎯 CARD SYSTEM
  const params = new URLSearchParams(window.location.search);
  let card = params.get("card");

  const data = {
    1: "roblox.jpeg",
    2: "roblox.jpeg",
    3: "roblox.jpeg",
    4: "roblox.jpeg"
  };

  let box = document.getElementById("selected");

  if (data[card]) {
    box.innerHTML = `
      <img src="${data[card]}"
      style="width:100%; height:350px; object-fit:cover; border-radius:16px;">
    `;
  } else {
    box.innerHTML = <p class="text-red-400 p-6">Invalid Card Selected</p>;
  }

});

document.addEventListener("DOMContentLoaded", function() {

  // DATE
  document.getElementById("date").innerText =
    new Date().toDateString();

  // USER ONLINE LIVE SYSTEM
  let base = 200;

  function updateUsers(){
    let random = Math.floor(Math.random() * 40);
    let el = document.getElementById("users");

    if (el) {
      el.innerText = base + random;
    }
  }

  updateUsers();
  setInterval(updateUsers, 1500);

});

  
</script>

</body>
</html>
