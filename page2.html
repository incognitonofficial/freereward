<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GiftCards - Select</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- لوگو (container سے باہر) -->
    <div class="logo-wrapper">
        <img src="images/logo3.png" alt="Logo" class="logo-img">
    </div>

    <!-- Stats Panel (container سے باہر) -->
    <div class="stats-panel">
        <div class="stats-line">
            <i class="fas fa-users"></i>
            <span id="userCount">200</span>
            <span> Online Users</span>
            <span class="separator">|</span>
            <i class="fas fa-calendar-alt"></i>
            <span id="updateDate">----</span>
        </div>
    </div>

    <!-- کارڈز (container سے باہر) -->
    <div class="cards-row" id="optionsRow">
    </div>

    <!-- پاپ اپ ماڈل -->
    <div id="popupModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="popup-container">
                <img id="popupImage" src="" alt="">
                <div class="popup-overlay">
                    
                    <!-- 🟢 Countdown Timer -->
                    <div class="timer-box">
                        <span>⏱️ This offer expires in: </span>
                        <span id="countdown">05:00</span>
                    </div>
                    
                    <div id="hiddenText" class="hidden-text" style="display: none;">
                        <div class="ready-text">Your Code is Ready!</div>
                        <div class="sponsor-text">Complete sponsor task to continue</div>
                        <div class="unlock-text">To unlock the last code!</div>
                    </div>
                    <div class="code-box">
                        <span id="fakeIp">2.80.188.</span>
                        <span id="runningNumber">####</span>
                    </div>
                    <a id="affiliateButton" class="complete-btn" href="#" target="_blank" style="display: none;">Complete Now</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cardImages = {
            fortnite: {
                main: "images/fortnitecard.png",
                25: "images/fortnitecard25.png",
                50: "images/fortnitecard50.png",
                100: "images/fortnitecard100.png"
            },
            google: {
                main: "images/googlegiftcard.png",
                25: "images/googlegiftcard25.png",
                50: "images/googlegiftcard50.png",
                100: "images/googlegiftcard100.png"
            },
            minecraft: {
                main: "images/minecraftcard.png",
                25: "images/minecraft25.png",
                50: "images/minecraft50.png",
                100: "images/minecraft100.png"
            },
            playstation: {
                main: "images/playstationgiftcard.png",
                25: "images/playstationgiftcard25.png",
                50: "images/playstationgiftcard50.png",
                100: "images/playstationgiftcard100.png"
            },
            roblox: {
                main: "images/robloxcard.png",
                25: "images/roblox25.png",
                50: "images/roblox50.png",
                100: "images/roblox100.png"
            },
            bestway: {
                main: "images/bestway.png",
                25: "images/bestway25.png",
                50: "images/bestway50.png",
                100: "images/bestway100.png"
            },
            xbox: {
                main: "images/xboxgiftcard.png",
                25: "images/xboxgiftcard25.png",
                50: "images/xboxgiftcard50.png",
                100: "images/xboxgiftcard100.png"
            },
            amazon: {
                main: "images/amazon.png",
                25: "images/amazon25.png",
                50: "images/amazon50.png",
                100: "images/amazon100.png"
            },
            apple: {
                main: "images/apple.png",
                25: "images/apple100.png",
                50: "images/apple250.png",
                100: "images/apple250.png"
            },
            itunes: {
                main: "images/itunes.png",
                25: "images/itunes25.png",
                50: "images/itunes50.png",
                100: "images/itunes100.png"
            },
            switch: {
                main: "images/switch.png",
                25: "images/switch25.png",
                50: "images/switch50.png",
                100: "images/switch100.png"
            },
            spotify: {
                main: "images/spotify.png",
                25: "images/spotify25.png",
                50: "images/spotify50.png",
                100: "images/spotify100.png"
            },
            steam: {
                main: "images/steam.png",
                25: "images/steam25.png",
                50: "images/steam50.png",
                100: "images/steam100.png"
            },
            walmart: {
                main: "images/walmart.png",
                25: "images/walmart25.png",
                50: "images/walmart50.png",
                100: "images/walmart100.png"
            },
            playstationplus: {
                main: "images/playstationplus.png",
                25: "images/playstationplus25.png",
                50: "images/playstationplus50.png",
                100: "images/playstationplus100.png"
            },
            discord: {
                main: "images/discord.png",
                25: "images/discord25.png",
                50: "images/discord50.png",
                100: "images/discord100.png"
            },
            shein: {
                main: "images/shein.png",
                25: "images/shein25.png",
                50: "images/shein50.png",
                100: "images/shein100.png"
            },
            twitch: {
                main: "images/twitch.png",
                25: "images/twitch25.png",
                50: "images/twitch50.png",
                100: "images/twitch100.png"
            }
        };

        const affiliateLink = "https://appsave.space/cl/i/w6j3x2";

        let currentUsers = 200;
        let selectedCardType = null;
        let selectedValue = null;
        let runningInterval = null;
        let currentNumber = 0;
        let targetNumber = 0;
        let countdownInterval = null;
        let timeLeft = 300;

        function updateUserCountSlowly() {
            let change = Math.floor(Math.random() * 35) + 5;
            if (Math.random() > 0.5) {
                currentUsers += change;
            } else {
                currentUsers -= change;
            }
            if (currentUsers > 800) currentUsers = 800;
            if (currentUsers < 200) currentUsers = 200;
            document.getElementById('userCount').textContent = currentUsers;
        }

        function setTodayDate() {
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('updateDate').textContent = today.toLocaleDateString('en-US', options);
        }

        function getCardFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('card') || 'fortnite';
        }

        function loadOptions(cardType) {
            const optionsRow = document.getElementById('optionsRow');
            optionsRow.innerHTML = '';
            
            const values = [25, 50, 100];
            values.forEach(value => {
                const card = document.createElement('div');
                card.className = 'card option-card';
                card.setAttribute('data-value', value);
                
                const img = document.createElement('img');
                img.src = cardImages[cardType][value];
                img.alt = '';
                
                card.appendChild(img);
                
                card.addEventListener('click', function() {
                    selectedValue = value;
                    showPopup(cardType, value);
                });
                
                optionsRow.appendChild(card);
            });
        }

        // 🟢 Countdown Timer Function
        function startCountdown() {
            const timerElement = document.getElementById('countdown');
            if (!timerElement) return;
            
            timeLeft = 300;
            
            if (countdownInterval) clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    timerElement.textContent = "00:00";
                } else {
                    timeLeft--;
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function showPopup(cardType, value) {
            const modal = document.getElementById('popupModal');
            const popupImage = document.getElementById('popupImage');
            const affiliateBtn = document.getElementById('affiliateButton');
            const runningSpan = document.getElementById('runningNumber');
            const fakeIpSpan = document.getElementById('fakeIp');
            const hiddenTextDiv = document.getElementById('hiddenText');
            
            popupImage.src = cardImages[cardType][value];
            affiliateBtn.href = affiliateLink;
            
            affiliateBtn.style.display = "none";
            hiddenTextDiv.style.display = "none";
            
            runningSpan.textContent = "0";
            
            targetNumber = Math.floor(Math.random() * (99999 - 10000 + 1)) + 10000;
            currentNumber = 0;
            
            const ipParts = [Math.floor(Math.random() * 255), Math.floor(Math.random() * 255), Math.floor(Math.random() * 255)];
            fakeIpSpan.textContent = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.`;
            
            if (runningInterval) clearInterval(runningInterval);
            
            runningInterval = setInterval(() => {
                if (currentNumber < targetNumber) {
                    currentNumber += Math.floor(Math.random() * 500) + 100;
                    if (currentNumber > targetNumber) currentNumber = targetNumber;
                    runningSpan.textContent = currentNumber;
                } else {
                    clearInterval(runningInterval);
                    runningInterval = null;
                    runningSpan.textContent = "####";
                    affiliateBtn.style.display = "block";
                    hiddenTextDiv.style.display = "block";
                }
            }, 30);
            
            modal.style.display = "flex";
            startCountdown();  // 🟢 Countdown Timer start
        }

        window.addEventListener('DOMContentLoaded', function() {
            setTodayDate();
            currentUsers = Math.floor(Math.random() * (800 - 200 + 1)) + 200;
            document.getElementById('userCount').textContent = currentUsers;
            setInterval(updateUserCountSlowly, 3000);
            
            selectedCardType = getCardFromURL();
            loadOptions(selectedCardType);
        });
        
        document.querySelector('.close').onclick = function() {
            document.getElementById('popupModal').style.display = "none";
            if (runningInterval) clearInterval(runningInterval);
            if (countdownInterval) clearInterval(countdownInterval);
        }
        
    </script>
</body>
</html>
